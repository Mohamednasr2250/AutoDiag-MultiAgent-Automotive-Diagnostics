version: "3.9"

# ── Custom Networks ────────────────────────────────────────
# Separate frontend and backend networks for isolation
networks:
  backend_net:
    driver: bridge
  frontend_net:
    driver: bridge

# ── Named Volumes ──────────────────────────────────────────
volumes:
  mlflow_data:
  grafana_data:
  redis_data:
  nginx_logs:

services:

  # ── 1. Nginx Reverse Proxy ─────────────────────────────
  # Handles SSL termination, rate limiting, load balancing
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - nginx_logs:/var/log/nginx
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - frontend_net
      - backend_net
    restart: unless-stopped

  # ── 2. FastAPI Backend ─────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      # BuildKit enabled for cache mounts
      args:
        - ENV=production
    # No direct port exposure — go through nginx
    expose:
      - "80"
    environment:
      - HF_API_KEY=${HF_API_KEY}
      - PINECONE_API_KEY=${PINECONE_API_KEY}
      - PINECONE_INDEX=${PINECONE_INDEX}
      - MLFLOW_TRACKING_URI=http://mlflow:5000
      - API_KEYS=${API_KEYS:-dev-key-123}
      - ENV=production
      - REDIS_URL=redis://redis:6379
    volumes:
      # Bind mounts — persist SQLite + data across container restarts
      - ./data:/app/data
      - ./models:/app/models
    depends_on:
      mlflow:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - backend_net
    restart: unless-stopped
    # HEALTHCHECK — backend waits for mlflow but also needs own check
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ── 3. MLflow Tracking Server ──────────────────────────
  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.16.2
    ports:
      - "5000:5000"
    volumes:
      - mlflow_data:/mlflow
    command: >
      mlflow server
      --backend-store-uri sqlite:///mlflow/mlflow.db
      --default-artifact-root /mlflow/artifacts
      --host 0.0.0.0
      --port 5000
    networks:
      - backend_net
    restart: unless-stopped
    # Healthcheck — backend waits for THIS before starting
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  # ── 4. Redis ───────────────────────────────────────────
  # Cache frequent diagnoses + rate limiting storage (slowapi)
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    networks:
      - backend_net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ── 5. Prometheus ─────────────────────────────────────
  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    networks:
      - backend_net
    restart: unless-stopped

  # ── 6. Grafana ─────────────────────────────────────────
  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
      - GF_SECURITY_ADMIN_USER=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
    networks:
      - backend_net
      - frontend_net
    restart: unless-stopped